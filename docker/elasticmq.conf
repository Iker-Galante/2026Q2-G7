# ElasticMQ: hace de SQS en docker compose. Las mismas tres colas que crea Terraform
# (terraform/colas.tf), con el mismo tiempo de invisibilidad y sus colas de fallidos.

include classpath("application.conf")

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  ateneo-inferencias {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "ateneo-inferencias-dlq"
      maxReceiveCount = 3
    }
  }
  ateneo-inferencias-dlq {}

  ateneo-evaluaciones {
    defaultVisibilityTimeout = 1800 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "ateneo-evaluaciones-dlq"
      maxReceiveCount = 2
    }
  }
  ateneo-evaluaciones-dlq {}

  ateneo-resultados {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "ateneo-resultados-dlq"
      maxReceiveCount = 5
    }
  }
  ateneo-resultados-dlq {}
}
