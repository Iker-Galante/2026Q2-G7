# Ateneo en local. Reproduce la topología de AWS con contenedores:
#   db        → RDS PostgreSQL          minio     → los buckets de S3
#   backend   → capa app (API + sitio + despachador)
#   worker    → capa inferencia (el "ALB interno" es el DNS de Docker: http://worker:8081)
#   evaluador → eval-1
#   herramientas (perfil tools) → CloudShell: bajar el modelo, preparar el conjunto
#
#   docker compose up -d --build
#   docker compose run --rm herramientas python tools/descargar_modelo.py
#   docker compose run --rm herramientas python tools/preparar_conjunto.py /datos/chest_xray/test --por-clase 100 --salida /salida/torax-rx/v1
#   docker compose run --rm herramientas aws s3 sync /salida/torax-rx s3://ateneo-evaluacion/torax-rx   (o con mc, ver README)
#   http://localhost:8080

x-aws: &aws
  AWS_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ateneo
      POSTGRES_PASSWORD: ateneo
      POSTGRES_DB: ateneo
    ports: ["5432:5432"]
    volumes: [db-datos:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ateneo -d ateneo"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-datos:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        for b in ateneo-web ateneo-modelos ateneo-estudios ateneo-evaluacion ateneo-deploy; do mc mb -p local/$$b; done &&
        mc ilm rule add --expire-days 7 local/ateneo-estudios || true &&
        echo buckets listos"

  migraciones:
    build: { context: ., dockerfile: docker/Dockerfile.worker }
    command: python tools/migrar.py
    environment:
      DATABASE_URL: postgresql://ateneo:ateneo@db:5432/ateneo
    depends_on:
      db: { condition: service_healthy }

  backend:
    build: { context: ., dockerfile: docker/Dockerfile.backend }
    ports: ["8080:8080"]
    environment:
      <<: *aws
      DATABASE_URL: postgresql://ateneo:ateneo@db:5432/ateneo
      BUCKET_MODELOS: ateneo-modelos
      BUCKET_ESTUDIOS: ateneo-estudios
      INFERENCIA_URL: http://worker:8081
      ORIGEN_WEB: http://localhost:8080
      WEB_DIR: /opt/ateneo/web
      S3_URL_PUBLICA: http://localhost:9000     # el navegador llega a MinIO por acá
    depends_on:
      migraciones: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: { context: ., dockerfile: docker/Dockerfile.worker }
    environment:
      <<: *aws
      MODELOS_DIR: /mnt/modelos
      HILOS: "2"
    volumes: [modelos-cache:/mnt/modelos]       # hace de EFS
    depends_on:
      minio-init: { condition: service_completed_successfully }

  evaluador:
    build: { context: ., dockerfile: docker/Dockerfile.worker }
    command: python -m evaluador.main
    environment:
      <<: *aws
      DATABASE_URL: postgresql://ateneo:ateneo@db:5432/ateneo
      BUCKET_EVALUACION: ateneo-evaluacion
      BUCKET_MODELOS: ateneo-modelos
      INTERVALO_SEGUNDOS: "5"
      HILOS: "2"
    depends_on:
      migraciones: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }

  tests:
    profiles: [tools]
    build: { context: ., dockerfile: docker/Dockerfile.tests }

  herramientas:
    profiles: [tools]
    build: { context: ., dockerfile: docker/Dockerfile.worker }
    environment:
      <<: *aws
      DATABASE_URL: postgresql://ateneo:ateneo@db:5432/ateneo
      BUCKET_MODELOS: ateneo-modelos
      BUCKET_EVALUACION: ateneo-evaluacion
    volumes:
      - ./datos:/datos                           # opcional: un dataset bajado a mano
      - ./tmp:/salida                            # acá quedan el modelo y el conjunto preparados
      - ./tools:/opt/worker/tools                # el código en vivo: editar no obliga a reconstruir
      - ./ateneo_ml:/opt/worker/ateneo_ml
    entrypoint: []
    command: ["sleep", "infinity"]

volumes:
  db-datos:
  minio-datos:
  modelos-cache:
